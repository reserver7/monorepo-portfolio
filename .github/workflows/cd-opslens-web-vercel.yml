name: CD - OpsLens Web (Vercel Tag Release)

on:
  push:
    tags: ["opslens-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 OpsLens 릴리스 태그 (예: opslens-v0.2.0)"
        required: true
        type: string

concurrency:
  group: cd-opslens-web-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    name: Verify Release Tag Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.resolve-release.outputs.release_sha }}
      release_tag: ${{ steps.resolve-release.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag and ensure commit belongs to main
        id: resolve-release
        env:
          MANUAL_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            release_sha="${GITHUB_SHA}"
          else
            release_tag="$(printf '%s' "${MANUAL_RELEASE_TAG}" | xargs)"
            if [ -z "${release_tag}" ]; then
              echo "release_tag 입력값이 비어 있습니다."
              exit 1
            fi
            git fetch --force --tags origin
            if ! git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              echo "태그를 찾을 수 없습니다: ${release_tag}"
              exit 1
            fi
            release_sha="$(git rev-list -n 1 "refs/tags/${release_tag}")"
          fi

          if ! [[ "${release_tag}" =~ ^opslens-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "OpsLens 릴리스 태그는 opslens-vX.Y.Z 형식이어야 합니다: ${release_tag}"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${release_sha}" "origin/main"; then
            echo "릴리스 태그는 main 이력 위 커밋만 허용됩니다: ${release_tag} (${release_sha})"
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "검증 완료: ${release_tag} -> ${release_sha}"

  deploy-opslens-web:
    name: Deploy OpsLens Web (Vercel Production)
    runs-on: ubuntu-latest
    needs: verify-tag-on-main
    timeout-minutes: 25

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_OPSLENS_WEB }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag-on-main.outputs.release_sha }}

      - name: Validate Vercel secrets
        id: vercel
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "OpsLens Web production domain is not configured yet. Skipping Vercel deployment."
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Deploy OpsLens Web from source
        if: ${{ steps.vercel.outputs.enabled == 'true' }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${VERCEL_TOKEN}"

      - name: Skip notice
        if: ${{ steps.vercel.outputs.enabled != 'true' }}
        run: echo "Deployment skipped because OpsLens Web production Vercel project is not configured."

      - name: Sync deployment status to OpsLens (optional)
        if: ${{ always() }}
        env:
          OPSLENS_CI_WEBHOOK_URL: ${{ secrets.OPSLENS_CI_WEBHOOK_URL }}
          OPSLENS_INGESTION_KEY: ${{ secrets.OPSLENS_INGESTION_KEY }}
          RELEASE_TAG: ${{ needs.verify-tag-on-main.outputs.release_tag }}
          CI_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${OPSLENS_CI_WEBHOOK_URL}" ] || [ -z "${OPSLENS_INGESTION_KEY}" ]; then
            echo "OpsLens CI webhook secrets are missing. Skipping status sync."
            exit 0
          fi
          if ! curl --fail-with-body --retry 2 --retry-all-errors -sS -X POST "${OPSLENS_CI_WEBHOOK_URL}" \
            -H "content-type: application/json" \
            -H "x-opslens-ingestion-key: ${OPSLENS_INGESTION_KEY}" \
            --data "{\"environment\":\"prod\",\"version\":\"${RELEASE_TAG}\",\"status\":\"${CI_STATUS}\"}"; then
            echo "::warning::OpsLens deployment status sync failed; the deployment result is unaffected."
          fi
