name: CI - Pull Request Validation

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full_validation:
        description: "Run every validation scope"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 18 * * 1-5"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: reserver7-projects

jobs:
  changes:
    name: Detect impacted scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      opslens: ${{ steps.filter.outputs.opslens }}
      opslens_e2e: ${{ steps.filter.outputs.opslens_e2e }}
      collab: ${{ steps.filter.outputs.collab }}
      ui: ${{ steps.filter.outputs.ui }}
      checks: ${{ steps.filter.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            opslens:
              - 'apps/opslens-server/**'
              - 'apps/opslens-web/**'
              - 'packages/opslens/**'
              - 'packages/react-query/**'
              - 'packages/forms/**'
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'packages/utils/**'
              - 'packages/zustand/**'
              - 'packages/configs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'playwright.opslens.config.ts'
              - 'tests/e2e/opslens-*.spec.ts'
            collab:
              - 'apps/collab-server/**'
              - 'apps/collab-web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            opslens_e2e:
              - 'apps/opslens-web/app/(app)/logs/**'
              - 'apps/opslens-web/app/(app)/services/**'
              - 'apps/opslens-web/features/logs/**'
              - 'apps/opslens-web/features/services/**'
              - 'packages/opslens/**'
              - 'packages/react-query/**'
              - 'tests/e2e/opslens-*.spec.ts'
              - 'playwright.opslens.config.ts'
            ui:
              - 'packages/ui/**'
              - 'packages/theme/**'
              - 'apps/storybook/**'
              - 'scripts/generate-ui-stories.mjs'
              - 'scripts/watch-ui-stories.mjs'
            checks:
              - '.github/workflows/**'
              - 'scripts/i18n/**'
              - 'apps/**/lib/i18n/**'
              - 'compose.infrastructure.yml'
              - 'scripts/audit-workspace.mjs'
              - 'pnpm-workspace.yaml'

  opslens:
    name: Validate OpsLens
    needs: changes
    if: ${{ needs.changes.outputs.opslens == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck --filter=@repo/opslens-server --filter=@repo/opslens-web
      - run: pnpm test:opslens-server

  opslens-e2e:
    name: Smoke test OpsLens flows
    needs: changes
    if: ${{ needs.changes.outputs.opslens_e2e == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Start isolated OpsLens test database
        run: docker compose -f compose.infrastructure.yml up -d postgres --wait
      - name: Prepare OpsLens test data
        env:
          DATABASE_URL: postgresql://portfolio:portfolio-local-password@127.0.0.1:5433/opslens?schema=public
          DIRECT_DATABASE_URL: postgresql://portfolio:portfolio-local-password@127.0.0.1:5433/opslens?schema=public
        run: pnpm db:opslens:generate && pnpm db:opslens:migrate:deploy && pnpm db:opslens:seed
      - name: Build OpsLens web test target
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4100/graphql
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3002
          NEXTAUTH_SECRET: opslens-e2e-nextauth-secret
          NEXTAUTH_URL: http://127.0.0.1:3002
          OPSLENS_AUTH_BRIDGE_SECRET: opslens-e2e-bridge-secret
        run: pnpm --filter @repo/opslens-web build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e:opslens --project=desktop-chromium --workers=1 --retries=0 --reporter=line
      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: opslens-playwright-report-${{ github.run_id }}
          path: playwright-report-opslens
          if-no-files-found: ignore
          retention-days: 7

  collab:
    name: Validate Collab
    needs: changes
    if: ${{ needs.changes.outputs.collab == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck --filter=@repo/collab-server --filter=@repo/collab-web
      - run: pnpm test:collab-server

  repository-checks:
    name: Validate repository checks
    needs: changes
    if: ${{ needs.changes.outputs.checks == 'true' || needs.changes.outputs.ui == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check && pnpm i18n:extract:check && pnpm i18n:sync:check
      - run: pnpm audit:workspace && pnpm infra:check
      - if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
        run: pnpm storybook:check

  chromatic:
    name: Validate UI Visual Regressions (Chromatic)
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'schedule' || inputs.full_validation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
        with: { version: 10.12.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build:storybook
