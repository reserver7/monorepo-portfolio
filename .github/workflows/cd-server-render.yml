name: CD - Collab Server (Render Tag Release)

on:
  push:
    tags: ["collab-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포 확인용 릴리스 태그 (예: v1.2.3)"
        required: true
        type: string

concurrency:
  group: cd-server-render-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    name: Verify Release Tag Commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.resolve-release.outputs.release_sha }}
      release_tag: ${{ steps.resolve-release.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag and ensure commit belongs to main
        id: resolve-release
        env:
          MANUAL_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            release_sha="${GITHUB_SHA}"
          else
            release_tag="$(printf '%s' "${MANUAL_RELEASE_TAG}" | xargs)"
            if [ -z "${release_tag}" ]; then
              echo "release_tag 입력값이 비어 있습니다."
              exit 1
            fi
            git fetch --force --tags origin
            if ! git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              echo "태그를 찾을 수 없습니다: ${release_tag}"
              exit 1
            fi
            release_sha="$(git rev-list -n 1 "refs/tags/${release_tag}")"
          fi

          if ! [[ "${release_tag}" =~ ^collab-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Collab 릴리스 태그는 collab-vX.Y.Z 형식이어야 합니다: ${release_tag}"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${release_sha}" "origin/main"; then
            echo "릴리스 태그는 main 이력 위 커밋만 허용됩니다: ${release_tag} (${release_sha})"
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "검증 완료: ${release_tag} -> ${release_sha}"

  deploy-server:
    name: Deploy Collab Server on Render
    runs-on: ubuntu-latest
    needs: verify-tag-on-main
    timeout-minutes: 12

    steps:
      - name: Validate deploy hook secret
        id: hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "has_hook=false" >> "${GITHUB_OUTPUT}"
            echo "RENDER_DEPLOY_HOOK_URL is missing. Skipping deploy trigger."
            exit 0
          fi

          echo "has_hook=true" >> "${GITHUB_OUTPUT}"

      - name: Detect Render API deployment support
        id: render-api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${RENDER_API_KEY}" ] && [ -n "${RENDER_SERVICE_ID}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "Render API secrets are missing. Falling back to the deploy hook."

      - name: Trigger Render deployment
        id: deploy
        if: ${{ steps.hook.outputs.has_hook == 'true' || steps.render-api.outputs.enabled == 'true' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RELEASE_SHA: ${{ needs.verify-tag-on-main.outputs.release_sha }}
          USE_RENDER_API: ${{ steps.render-api.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "${USE_RENDER_API}" = "true" ]; then
            response="$(curl --fail-with-body -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "accept: application/json" \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              -H "content-type: application/json" \
              --data "{\"commitId\":\"${RELEASE_SHA}\"}")"
          else
            response="$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}")"
          fi

          deploy_id="$(printf '%s' "${response}" | jq -r '.id // empty' 2>/dev/null || true)"
          echo "deploy_id=${deploy_id}" >> "${GITHUB_OUTPUT}"
          echo "Collab Render deployment accepted."

      - name: Validate health check URL
        id: health
        if: ${{ steps.hook.outputs.has_hook == 'true' || steps.render-api.outputs.enabled == 'true' }}
        env:
          SERVER_HEALTHCHECK_URL: ${{ secrets.SERVER_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HEALTHCHECK_URL}" ]; then
            echo "has_health=false" >> "${GITHUB_OUTPUT}"
            echo "SERVER_HEALTHCHECK_URL is missing. Skipping health verification."
            exit 0
          fi

          echo "has_health=true" >> "${GITHUB_OUTPUT}"

      - name: Verify public endpoint reachability (optional)
        if: ${{ (steps.hook.outputs.has_hook == 'true' || steps.render-api.outputs.enabled == 'true') && steps.health.outputs.has_health == 'true' }}
        env:
          SERVER_HEALTHCHECK_URL: ${{ secrets.SERVER_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 15 -sS \
            "${SERVER_HEALTHCHECK_URL}" >/dev/null
          echo "Collab public endpoint is reachable."

      - name: Verify Render deployment status (optional)
        if: ${{ steps.render-api.outputs.enabled == 'true' && steps.deploy.outputs.deploy_id != '' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            response="$(curl --fail-with-body -sS \
              -H "accept: application/json" \
              -H "authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}")"
            status="$(printf '%s' "${response}" | jq -r '.status // empty' | tr '[:upper:]' '[:lower:]')"
            case "${status}" in
              live)
                echo "Collab Render deployment is live."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deployment failed with status: ${status}"
                exit 1
                ;;
              *)
                echo "Waiting for Render deployment... (${attempt}/60, status: ${status:-unknown})"
                sleep 10
                ;;
            esac
          done
          echo "Timed out waiting for Render deployment status."
          exit 1

      - name: Skip notice (missing deploy hook)
        if: ${{ steps.hook.outputs.has_hook != 'true' && steps.render-api.outputs.enabled != 'true' }}
        run: echo "Deployment skipped because neither a Render deploy hook nor API credentials are configured."
